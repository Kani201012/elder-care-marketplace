name: CI

# This runs automatically every time you push code to GitHub, or open a
# pull request. It does NOT deploy your site anywhere — it just checks
# that the app still installs and starts correctly, so you find out about
# a broken change on GitHub instead of discovering it live.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Get your repository's code onto the runner
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Install Node.js (same version range the app was built and tested with)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Install dependencies exactly as package-lock.json specifies —
      #    npm ci is stricter and faster than "npm install" for CI use.
      - name: Install dependencies
        run: npm ci

      # 4. Create a throwaway .env for testing only. These are NOT your
      #    real admin credentials — they exist only inside this temporary
      #    CI run and are never used for your live site.
      - name: Create test environment file
        run: |
          cat > .env << 'EOF'
          PORT=3000
          SESSION_SECRET=ci-test-secret-not-used-in-production
          ADMIN_EMAIL=ci-test@example.com
          ADMIN_PASSWORD=CiTestPassword123
          EOF

      # 5. Create the test admin account in a throwaway database
      - name: Seed test admin account
        run: npm run seed-admin

      # 6. Start the server in the background, then confirm it actually
      #    responds — this is the core "did I break something" check.
      - name: Start server and verify it responds
        run: |
          node server/index.js &
          SERVER_PID=$!
          sleep 3

          echo "Checking /api/health ..."
          curl --fail -s http://localhost:3000/api/health

          echo ""
          echo "Checking the public landing page loads ..."
          curl --fail -s -o /dev/null http://localhost:3000/

          echo "Checking a family signup submission works ..."
          curl --fail -s -X POST http://localhost:3000/api/families \
            -H "Content-Type: application/json" \
            -d '{"contact_name":"CI Test","contact_phone":"9000000000","elderly_name":"Test Elder","area":"Test Area"}'

          echo ""
          echo "All smoke tests passed. Stopping server."
          kill $SERVER_PID

      # 7. Clean up the throwaway database/env so nothing test-related
      #    accidentally gets committed or cached between runs.
      - name: Clean up test artifacts
        if: always()
        run: rm -f data.db data.db-shm data.db-wal .env
